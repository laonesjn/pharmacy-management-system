<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Categories - Pharmacy Management System</title>

    <link rel="stylesheet"
          href="/css/dashboard.css">

    <link rel="stylesheet"
          href="/css/categories.css">

</head>

<body>

<header class="topbar">

    <h2>Pharmacy Management System</h2>

    <div>

        <span id="userName"></span>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</header>


<aside class="sidebar">

     <a href="/pages/dashboard.html">
            Dashboard
        </a>

        <a href="/pages/medicines.html">
            Medicines
        </a>

        <a href="/pages/categories.html" id="categoriesMenu">
            Categories
        </a>

        <a href="/pages/suppliers.html" id="suppliersMenu">
            Suppliers
        </a>

        <a href="/pages/stock.html">
            Stock
        </a>

        <a href="/pages/expiry.html">
            Expiry Monitoring
        </a>

        <a href="/pages/sales.html">
            Sales
        </a>

        <a
            href="/pages/users.html"
            id="usersMenu"
        >
            Users
        </a>
    <a
        href="/pages/admin/discounts.html"
        id="discountsMenu"
        style="display:none"
    >
        Discounts
    </a>

</aside>


<main class="content">

    <h1>Category Management</h1>

    <p id="welcomeMessage"></p>


    <!-- CATEGORY FORM -->

    <section class="category-form">

        <h2 id="formTitle">
            Add New Category
        </h2>

        <form id="categoryForm">

            <input
                type="hidden"
                id="categoryId"
            >

            <div class="form-grid">

                <div>

                    <label>
                        Category Name
                    </label>

                    <input
                        type="text"
                        id="categoryName"
                        placeholder="Enter category name"
                        required
                    >

                </div>


                <div>

                    <label>
                        Description
                    </label>

                    <input
                        type="text"
                        id="description"
                        placeholder="Enter description"
                    >

                </div>

            </div>


            <div class="form-buttons">

                <button type="submit">
                    Save Category
                </button>

                <button
                    type="button"
                    id="cancelBtn"
                    class="cancel-btn"
                >
                    Cancel
                </button>

            </div>

        </form>

    </section>


    <!-- CATEGORY LIST -->

    <section class="category-list">

        <div class="list-header">

            <h2>
                Category List
            </h2>

            <input
                type="text"
                id="searchInput"
                placeholder="Search category..."
            >

        </div>


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Category Name</th>

                    <th>Description</th>

                    <th>Actions</th>

                </tr>

            </thead>


            <tbody id="categoryTable">

            </tbody>

        </table>

    </section>

</main>


<script src="/js/categories.js"></script>
<script src="/js/roleMenu.js?v=20261102"></script>

</body>

</html>
